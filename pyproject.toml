[project]
name = "voice-vocabulary-platform"
version = "0.1.0"
description = "Production-Ready Badaga & Marwari Voice-Based Vocabulary Learning Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.6",
    "celery>=5.4.0",
    "structlog>=24.2.0",
    "transformers>=4.41.0",
    "soundfile>=0.12.1",
    "scipy>=1.13.0",
    "noisereduce>=3.0.2",
    "pymilvus>=2.4.3",
    "qdrant-client>=1.9.1",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",
    "boto3>=1.34.0",
    "openpyxl>=3.1.4",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.8",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "workers*"]
exclude = ["Badaga*", "Marwari*", "docs*", "scripts*"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests", "apps/api/tests"]
